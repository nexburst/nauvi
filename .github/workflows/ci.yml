name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache (GitHub keeps 10 GB per repo); PRs and tags reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The unit and CLI tests on the other desktop platforms (#118). The
  # cluster tests stay #[ignore]d.
  test-other-os:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache (GitHub keeps 10 GB per repo); PRs and tags reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The local-shell test runs kubectl in a PTY (Unix only); the macOS
      # image has no kubectl.
      - name: Install kubectl (macOS)
        if: runner.os == 'macOS'
        run: |
          version=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$version/bin/darwin/arm64/kubectl" \
            || sudo curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$version/bin/darwin/arm64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          kubectl version --client
      - run: cargo test --workspace --locked

  desktop-build:
    name: desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache (GitHub keeps 10 GB per repo); PRs and tags reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: desktop/ui-src/package-lock.json
      - name: Build the frontend
        run: |
          npm ci
          npm run build
        working-directory: desktop/ui-src
      - name: Build desktop crate
        run: cargo build -p kubeloupe-desktop --locked

  frontend:
    name: frontend (svelte-check, bindings)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache (GitHub keeps 10 GB per repo); PRs and tags reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: desktop/ui-src/package-lock.json
      - name: Regenerate the TypeScript bindings
        run: cargo test -p kubeloupe-desktop --locked export_typescript_bindings
      - name: Fail if bindings.ts is out of date
        run: |
          git diff --exit-code -- desktop/ui-src/src/lib/bindings.ts || {
            echo "::error::bindings.ts is out of date. Run 'cargo test -p kubeloupe-desktop export_typescript_bindings' and commit it."
            exit 1
          }
      - run: npm ci
        working-directory: desktop/ui-src
      - run: npm run build
        working-directory: desktop/ui-src
      - name: Fail if the test entry leaked into the production build
        run: |
          if [ -e dist/test.html ] || grep -rqE "__fake|fake-backend" dist; then
            echo "::error::dist/ contains the test-only entry (test.html / src/test)."
            exit 1
          fi
        working-directory: desktop/ui-src
      - run: npm run check
        working-directory: desktop/ui-src
      - name: Unit tests (Vitest)
        run: npm test
        working-directory: desktop/ui-src
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
        working-directory: desktop/ui-src
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: desktop/ui-src
      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: desktop/ui-src
      - name: App tests (Playwright, fake backend)
        run: npx playwright test
        working-directory: desktop/ui-src
      - name: Upload Playwright screenshots and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            desktop/ui-src/test-results/
            desktop/ui-src/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
