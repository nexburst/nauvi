name: QA

# The real app on WebKitGTK through every QA scenario (desktop/e2e/qa/) plus
# the smoke suite, against kind with metrics-server, the limited user, helm,
# a small Prometheus and a second cluster. Too slow for every PR: nightly and
# on demand (`gh workflow run qa.yml --ref <branch>`). See desktop/e2e/README.md.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Run only these scenarios (space-separated names under desktop/e2e/qa/, e.g. 'area-4-dock helm-charts'). Empty: smoke + every scenario."
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * *"

permissions: {}

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Built once; every shard downloads it. The frontend is embedded
  # (custom-protocol), so the shards need neither Rust nor ui-src.
  build:
    name: Build the app (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAURI_DRIVER_VERSION: 2.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Install the Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache (GitHub keeps 10 GB per repo); PRs and tags reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Same build as the e2e job in integration.yml.
          shared-key: qa
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tauri-driver-cache
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ env.TAURI_DRIVER_VERSION }}
      - name: Install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: desktop/ui-src/package-lock.json
      - name: Build the app and the CLI
        run: |
          npm --prefix desktop/ui-src ci
          npm --prefix desktop/ui-src run build
          cargo build -p nauvi-desktop --locked --features tauri/custom-protocol
          # area-4-attach-debug drives the CLI's exec and debug too.
          cargo build -p nauvi --locked
          mkdir -p "$RUNNER_TEMP/qa-app"
          cp target/debug/nauvi-desktop target/debug/nauvi ~/.cargo/bin/tauri-driver "$RUNNER_TEMP/qa-app/"
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-app
          path: ${{ runner.temp }}/qa-app/
          retention-days: 1
          if-no-files-found: error
      # The Docker Hub images the demo workload, Prometheus and the scenarios
      # run, pulled once (through mirror.gcr.io) instead of by every shard's
      # nodes: four shards pulling them hit ErrImagePull (#269).
      - name: Pull the test images
        run: |
          mkdir -p "$RUNNER_TEMP/qa-images"
          bash scripts/test-cluster/images.sh save "$RUNNER_TEMP/qa-images/images.tar" --prometheus
      - name: Upload the test images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-images
          path: ${{ runner.temp }}/qa-images/
          retention-days: 1
          if-no-files-found: error
          # Image layers are compressed already.
          compression-level: 0

  # The full suite takes about an hour on one runner, so it is split into
  # shards of about the same run time (qa.sh --shard, weights in
  # desktop/e2e/qa-weights.json), each with its own clusters. A `scenario`
  # input runs as a single shard.
  qa:
    name: QA scenarios (WebKitGTK, kind, shard ${{ matrix.shard }})
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.scenario && '[1]' || '[1, 2, 3, 4]') }}
    env:
      SHARDS: ${{ inputs.scenario && 1 || 4 }}
      SHARD: ${{ matrix.shard }}
      NAUVI_LIMITED_KUBECONFIG: /home/runner/.kube/nauvi-limited.yaml
      QA_PROMETHEUS: "1"
      # Its own cluster: the reconnect scenario may pause it long enough for
      # the app's watches to time out.
      QA_PAUSE_MAX_MS: "360000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two kind clusters, the app and many log streams share the runner's
      # inotify instances (default 128); without more, the kubelet fails log
      # streams with "failed to create fsnotify watcher: too many open files".
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Download the test images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qa-images
          path: ${{ runner.temp }}/qa-images

      # Both clusters (nauvi-test with metrics-server and the demo
      # workload, and the empty nauvi-staging for the multi-window
      # scenario), then Prometheus so it has scraped a while before the
      # scenarios look at its charts. Runs while the rest is set up. The
      # nodes get the test images from the build job's archive.
      - name: Create kind clusters and Prometheus (background)
        run: |
          export NAUVI_IMAGES="$RUNNER_TEMP/qa-images/images.tar"
          mkdir -p "$RUNNER_TEMP/cluster"
          ( ( set -e
              bash scripts/test-cluster/setup.sh --staging
              kubectl --context kind-nauvi-test apply -f scripts/test-cluster/prometheus.yaml
            ) > "$RUNNER_TEMP/cluster/setup.log" 2>&1
            echo $? > "$RUNNER_TEMP/cluster/rc" ) &

      - name: Install WebKitGTK, WebKitWebDriver, Xvfb and xclip
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 xvfb xclip x11-utils
          # The package was renamed in newer Ubuntu releases.
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          driver="$(command -v WebKitWebDriver || find /usr -name WebKitWebDriver -type f -perm -u+x 2>/dev/null | head -n 1)"
          echo "WEBKIT_DRIVER=$driver" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: desktop/e2e/package-lock.json
      - name: Install npm dependencies
        run: npm --prefix desktop/e2e ci

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qa-app
          path: ${{ runner.temp }}/qa-app
      # Where qa.sh --no-build and the scenarios look for them.
      - name: Put the build in place
        run: |
          mkdir -p target/debug
          install -m 0755 "$RUNNER_TEMP/qa-app/nauvi-desktop" "$RUNNER_TEMP/qa-app/nauvi" target/debug/
          install -m 0755 "$RUNNER_TEMP/qa-app/tauri-driver" "$RUNNER_TEMP/tauri-driver"
          echo "TAURI_DRIVER=$RUNNER_TEMP/tauri-driver" >> "$GITHUB_ENV"
          missing="$(ldd target/debug/nauvi-desktop | grep 'not found' || true)"
          [ -z "$missing" ] || { echo "missing libraries: $missing"; exit 1; }

      - name: Wait for the clusters
        run: |
          for _ in $(seq 1 600); do [ -f "$RUNNER_TEMP/cluster/rc" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/cluster/setup.log"
          [ "$(cat "$RUNNER_TEMP/cluster/rc" 2>/dev/null)" = 0 ]
          bash scripts/test-cluster/wait-demo.sh
          kubectl --context kind-nauvi-test -n monitoring rollout status deploy/prometheus-server --timeout=180s

      - name: Create limited user
        run: bash scripts/test-cluster/limited-user.sh "$NAUVI_LIMITED_KUBECONFIG"

      - name: QA scenarios and smoke suite
        working-directory: desktop/e2e
        env:
          SCENARIOS: ${{ inputs.scenario }}
        run: |
          if [ -n "$SCENARIOS" ]; then
            # Per-PR QA: `gh workflow run qa.yml --ref <branch> -f scenario='<names>'`
            # shellcheck disable=SC2086 # a space-separated list of names
            ./qa.sh --no-build --out artifacts/qa $SCENARIOS
          else
            ./qa.sh --no-build --out artifacts/qa --shard "$SHARD/$SHARDS" smoke.test.mjs qa/*.test.mjs
          fi

      - name: Upload screenshots, page text, logs and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-shard-${{ matrix.shard }}
          path: desktop/e2e/artifacts/qa/
          retention-days: 3
          if-no-files-found: warn

      - name: Debug info
        if: failure()
        run: |
          kubectl --context kind-nauvi-test get pods -A -o wide || true
          kubectl --context kind-nauvi-test get events -A --sort-by=.lastTimestamp | tail -50 || true
          kubectl --context kind-nauvi-test -n monitoring logs deploy/prometheus-server --tail=50 || true

  # One report and one `qa-artifacts` artifact from all the shards, laid out
  # like a single qa.sh run (with run.log and xvfb.log per shard).
  report:
    name: QA report
    needs: qa
    if: always() && needs.qa.result != 'skipped'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: desktop/e2e/lib
      - name: Download the shards' output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qa-shard-*
          path: ${{ runner.temp }}/shards
      - name: Merge them and write the report
        run: |
          out="$RUNNER_TEMP/qa"
          mkdir -p "$out"
          for dir in "$RUNNER_TEMP"/shards/qa-shard-*; do
            [ -d "$dir" ] || continue
            n="${dir##*-}"
            if [ -f "$dir/results.jsonl" ]; then cat "$dir/results.jsonl" >> "$out/results.jsonl"; fi
            for log in run xvfb; do
              if [ -f "$dir/$log.log" ]; then mv "$dir/$log.log" "$out/$log-shard-$n.log"; fi
            done
            rm -f "$dir/results.jsonl" "$dir/report.md"
            cp -r "$dir"/. "$out"/
          done
          if [ -f "$out/results.jsonl" ]; then
            node desktop/e2e/lib/qa-report.mjs "$out" > "$out/report.md"
            cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Screenshots, page text and app logs: the \`qa-artifacts\` artifact (\`gh run download $GITHUB_RUN_ID -n qa-artifacts\`)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No QA report: the shards stopped before the scenarios." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots, page text, logs and the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-artifacts
          path: ${{ runner.temp }}/qa/
          retention-days: 14
          if-no-files-found: warn

  # Some real coverage for Windows (WebView2 through tauri-driver and
  # msedgedriver): start-up with an unreachable cluster, Settings and the
  # theme; local terminals in pwsh, Windows PowerShell and cmd (ConPTY) and
  # a second window. No cluster here; macOS has no WebDriver at all. The app passes
  # msedgedriver's WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS on to WebView2
  # (desktop/src/webview_args.rs, #93).
  windows:
    name: QA start-up (Windows, WebView2)
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_DRIVER_VERSION: 2.1.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache (GitHub keeps 10 GB per repo); PRs and tags reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: qa-windows
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tauri-driver-cache
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ runner.os }}-${{ env.TAURI_DRIVER_VERSION }}
      - name: Install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"

      # msedgedriver must match the WebView2 runtime the app uses.
      - name: Fetch msedgedriver for the WebView2 runtime
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $version) { $version = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          Write-Host "WebView2 runtime: $version"
          $dir = "$env:RUNNER_TEMP\msedgedriver"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir\driver.zip"
          Expand-Archive "$dir\driver.zip" -DestinationPath $dir -Force
          "NATIVE_DRIVER=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: |
            desktop/ui-src/package-lock.json
            desktop/e2e/package-lock.json
      - name: Install npm dependencies
        run: |
          npm --prefix desktop/ui-src ci
          npm --prefix desktop/e2e ci
      - name: Build the app
        run: |
          npm --prefix desktop/ui-src run build
          cargo build -p nauvi-desktop --locked --features tauri/custom-protocol

      - name: Start-up scenario
        working-directory: desktop/e2e
        env:
          E2E_ARTIFACTS: artifacts/qa-windows
        run: |
          mkdir -p artifacts/qa-windows
          set +e
          node --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./lib/qa-reporter.mjs --test-reporter-destination=artifacts/qa-windows/results.jsonl \
            qa/startup.test.mjs qa/windows.test.mjs
          rc=$?
          node lib/qa-report.mjs artifacts/qa-windows > artifacts/qa-windows/report.md
          { echo "## Windows"; tail -n +2 artifacts/qa-windows/report.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload screenshots, page text and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-artifacts-windows
          path: desktop/e2e/artifacts/qa-windows/
          retention-days: 14
          if-no-files-found: warn
