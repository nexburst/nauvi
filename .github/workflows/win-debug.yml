name: win-debug (temporary, #93)

on:
  push:
    branches: [issue-93-windows-webdriver]

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          save-if: false
          shared-key: qa-windows
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/ui-src/.nvmrc
      - name: Build
        shell: bash
        run: |
          npm --prefix desktop/ui-src ci
          npm --prefix desktop/ui-src run build
          cargo build -p kubeloupe-desktop --locked --features tauri/custom-protocol
      - name: msedgedriver
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          Write-Host "WebView2 runtime: $version"
          $dir = "$env:RUNNER_TEMP\msedgedriver"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir\driver.zip"
          Expand-Archive "$dir\driver.zip" -DestinationPath $dir -Force
      - name: App with a remote-debugging port from the environment
        shell: pwsh
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9333"
          $p = Start-Process -FilePath target\debug\kubeloupe-desktop.exe -PassThru -RedirectStandardError app-err.txt -RedirectStandardOutput app-out.txt
          Start-Sleep 25
          try { (Invoke-WebRequest http://127.0.0.1:9333/json/version -UseBasicParsing).Content } catch { "no devtools: $_" }
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 3 -ExpandProperty CommandLine
          Get-ChildItem "$env:LOCALAPPDATA\com.kubeloupe.app" -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object FullName
          Get-Content app-err.txt -ErrorAction SilentlyContinue | Select-Object -Last 30
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: msedgedriver session, verbose
        shell: pwsh
        run: |
          $d = Start-Process -FilePath "$env:RUNNER_TEMP\msedgedriver\msedgedriver.exe" -ArgumentList "--port=4445","--verbose","--log-path=$env:RUNNER_TEMP\edge.log" -PassThru
          Start-Sleep 3
          $app = (Resolve-Path target\debug\kubeloupe-desktop.exe).Path
          $body = @{ capabilities = @{ alwaysMatch = @{ browserName = "webview2"; "ms:edgeChromium" = $true; "ms:edgeOptions" = @{ binary = $app; args = @() } } } } | ConvertTo-Json -Depth 8
          try { (Invoke-WebRequest http://127.0.0.1:4445/session -Method Post -Body $body -ContentType "application/json" -UseBasicParsing -TimeoutSec 120).Content } catch { "session failed: $_" }
          Start-Sleep 2
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 2 -ExpandProperty CommandLine
          Get-CimInstance Win32_Process -Filter "Name='kubeloupe-desktop.exe'" | Select-Object -ExpandProperty CommandLine
          Get-Content "$env:RUNNER_TEMP\edge.log" | Select-String -Pattern "WEBVIEW2|user-data|DevToolsActivePort|Launching|remote-debugging|ERROR|env" | Select-Object -First 60
          Get-Process kubeloupe-desktop,msedgewebview2,msedgedriver -ErrorAction SilentlyContinue | Stop-Process -Force
