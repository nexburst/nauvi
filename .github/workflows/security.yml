name: Security

# Supply-chain and workflow checks (#214): cargo-deny (advisories, licences,
# bans, sources; config in deny.toml), npm audit of the shipped frontend
# dependencies and zizmor on these workflows (config in .github/zizmor.yml).
# Weekly as well, because new advisories appear without any change here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  npm-audit:
    name: npm audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/ui-src/.nvmrc
      # Only what ships in the app; dev tooling (Vite, Playwright, ...) never
      # reaches users.
      - name: npm audit (desktop/ui-src, production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: desktop/ui-src

  zizmor:
    name: zizmor
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security: false prints the findings and fails the job instead
      # of uploading SARIF, so it works on PRs from forks too.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          # A fixed version, so a new audit shows up through a deliberate bump.
          version: 1.32.0
