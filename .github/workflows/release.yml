name: Release

# Pushing a tag like v0.1.0 builds the desktop installers and CLI binaries for
# Linux, macOS and Windows and releases them:
#   1. `prepare` checks the versions and creates a *draft* release.
#   2. `desktop` and `cli` build, smoke-check and upload into the draft.
#   3. `sbom` writes CycloneDX SBOMs of the Rust crates (cargo-cyclonedx)
#      and the frontend's npm dependencies (npm sbom); `scan` runs Grype on
#      them and on the unpacked Linux bundles and CLI, and fails on a High
#      or Critical finding that has a fix (#341). Neither sees a secret.
#      `install-check` runs install.sh and install.ps1 -Cli against the
#      built files (#430), with a read-only token. `apt-check` builds a
#      test apt repository from the .deb with a throwaway key and installs
#      and upgrades nauvi from it in Ubuntu containers (#427).
#   4. `publish` checks every expected asset is there, verifies the update
#      signatures, writes latest.json (the in-app updater's endpoint, #30)
#      and SHA256SUMS, uploads them with the SBOMs and only then publishes
#      the draft. A failed build or scan leaves just the draft. It also
#      writes the installer sizes to the job summary.
#   5. `homebrew` pushes the cask and formula that `publish` rendered to
#      nexburst/homebrew-tap (#168), if the HOMEBREW_TAP_TOKEN secret is set.
#   6. `apt` adds the .deb to the apt repository and signs it, if the
#      APT_GPG_PRIVATE_KEY secret is set; `apt-pages` pushes it to the
#      gh-pages branch, which GitHub Pages serves (#427).
#   7. `docs-pages` publishes the tag's docs to docs/<tag>/ on gh-pages and
#      moves docs/latest/ to the newest release, through pages.yml (#468).
#      It and `apt-pages` each change only their own paths of gh-pages.
#
# The update bundles are signed with the TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)
# secrets of the `release` environment (reviewers, v* tags only); the public
# key is in desktop/tauri.conf.json, and `publish` checks every signature
# against it. They are not repository secrets: those reach a workflow on any
# branch, and every install trusts this key (#442). A dry run never sees
# them: `prepare` makes a throwaway key, `desktop` signs with it and
# `publish` checks the signatures against it instead.
#
# Running it by hand (Actions > Release > Run workflow) is a dry run by
# default: it builds everything and uploads it as workflow artifacts, without
# creating a tag or a release. Use it to test release changes before tagging.
#
# Every Monday it also runs as a dry run on main (#439). That saves the Rust
# caches the release jobs restore (only main saves caches), so a tag or a
# dry run from a branch starts warm instead of compiling everything, and it
# shows a broken release pipeline before a tag does.
#
# Bump versions with scripts/bump-version.sh. Pre-releases must be numeric
# (v0.2.0-1, not v0.2.0-rc.1) because the MSI bundler (WiX) rejects others.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only and upload workflow artifacts (no release). Turning this off only works when run from a v* tag."
        type: boolean
        default: true

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      dry_run: ${{ steps.meta.outputs.dry_run }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
      # Dry runs only: a throwaway updater key, made in this run (#442).
      # Not a secret; nothing trusts it.
      dry_run_key: ${{ steps.dry_key.outputs.key }}
      dry_run_pubkey: ${{ steps.dry_key.outputs.pubkey }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the version and mode
        id: meta
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          fail=0
          for f in desktop/Cargo.toml; do
            v=$(grep -m1 '^version' "$f" | sed -E 's/.*"(.*)".*/\1/')
            [ "$v" = "$version" ] || { echo "::error::$f version $v != Cargo.toml $version"; fail=1; }
          done
          v=$(python3 -c "import json;print(json.load(open('desktop/tauri.conf.json'))['version'])")
          [ "$v" = "$version" ] || { echo "::error::tauri.conf.json version $v != Cargo.toml $version"; fail=1; }
          for p in nauvi nauvi-desktop; do
            v=$(grep -A1 "^name = \"$p\"$" Cargo.lock | sed -nE 's/^version = "(.*)"/\1/p')
            [ "$v" = "$version" ] || { echo "::error::Cargo.lock $p version $v != Cargo.toml $version"; fail=1; }
          done
          # WiX (MSI) only takes a numeric pre-release, at most 65535.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-([0-9]+))?$ ]] || \
             [ "${BASH_REMATCH[2]:-0}" -gt 65535 ]; then
            echo "::error::version $version is not MAJOR.MINOR.PATCH[-N] (N <= 65535); the MSI bundler would reject it"
            fail=1
          fi
          [ "$fail" -eq 0 ] || { echo "Fix with scripts/bump-version.sh <version>"; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            dry_run=false
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then
            dry_run=false
          else
            dry_run=true
          fi

          if [ "$dry_run" = "false" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::A real release must run from a v* tag (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            [ "$tag" = "v$version" ] || { echo "::error::tag $tag != v$version"; exit 1; }
          else
            tag="v$version"
          fi
          echo "dry_run=$dry_run tag=$tag version=$version"
          {
            echo "dry_run=$dry_run"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create a draft release with generated notes
        id: release
        if: steps.meta.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # Reuse the draft of an earlier failed run; never touch a published one.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n1)
          if [ -n "$existing" ]; then
            read -r id draft <<<"$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to modify it"
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            cat > notes.md <<'EOF'
          The builds are not signed yet, so the OS will warn you the first time:

          - **macOS**: drag the app to Applications and open it; when macOS says it could not verify the app, click Done, then click **Open Anyway** in System Settings > Privacy & Security (on macOS 15 and later, right-click > Open no longer does this). If macOS says the app is damaged, run `xattr -dr com.apple.quarantine /Applications/nauvi.app`.
          - **Windows**: SmartScreen shows "Windows protected your PC"; click More info, then Run anyway.
          - **Linux**: no workaround needed; the AppImage needs FUSE 2 (`libfuse2`) on recent Ubuntu.

          Verify a download with `sha256sum -c SHA256SUMS --ignore-missing`.
          EOF
            pre=""
            case "$TAG" in *-*) pre="--prerelease";; esac
            gh release create "$TAG" --draft --verify-tag $pre \
              --title "nauvi $TAG" --notes-file notes.md --generate-notes
            # The list can lag behind the create by a few seconds (v0.1.0's
            # first run found nothing, #450): look again before giving up.
            id=""
            for wait in 0 2 4 8 16; do
              sleep "$wait"
              id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n1)
              [ -z "$id" ] || break
              echo "the new draft is not listed yet"
            done
          fi
          [ -n "$id" ] || { echo "::error::could not find the draft release id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.meta.outputs.dry_run == 'true'
        with:
          node-version-file: desktop/ui-src/.nvmrc

      # The Tauri CLI from the lockfile, no install scripts: only to make the
      # dry run's throwaway key.
      - name: Make a throwaway updater key (dry run)
        id: dry_key
        if: steps.meta.outputs.dry_run == 'true'
        working-directory: desktop/ui-src
        run: |
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w "$RUNNER_TEMP/dry-run.key" >/dev/null
          echo "key=$(cat "$RUNNER_TEMP/dry-run.key")" >> "$GITHUB_OUTPUT"
          echo "pubkey=$(cat "$RUNNER_TEMP/dry-run.key.pub")" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/dry-run.key" "$RUNNER_TEMP/dry-run.key.pub"

  desktop:
    needs: prepare
    # The signing key is only in the `release` environment, so only a real
    # release (from a v* tag, after a reviewer approves) can read it (#442).
    environment: ${{ needs.prepare.outputs.dry_run == 'false' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc on purpose: runs on more distros
            name: linux
            args: ""
            targets: ""
          - os: macos-latest
            name: macos-universal
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            name: windows
            args: ""
            targets: ""
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      # zizmor's cache-poisoning audit is ignored for this file in
      # .github/zizmor.yml, which says why.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache (GitHub keeps 10 GB per repo); PRs and tags reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: release-desktop

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/ui-src/.nvmrc
          cache: npm
          cache-dependency-path: desktop/ui-src/package-lock.json

      # `cargo tauri build` then builds the frontend itself through
      # tauri.conf.json's beforeBuildCommand (`npm run build` in ui-src), the
      # same way a local build does.
      - name: Install the frontend dependencies
        run: npm ci
        working-directory: desktop/ui-src

      # The Tauri CLI is the prebuilt @tauri-apps/cli from ui-src's
      # package-lock.json (#439; compiling tauri-cli took 6-9 minutes per
      # job). An exact version, checked by the lockfile's integrity hashes
      # (#245): this job holds the signing key and a `contents: write` token,
      # so it must not pick up a new release of the CLI on its own. Bump it
      # on purpose, next to @tauri-apps/api and the `tauri` crate.
      - name: Check the Tauri CLI
        shell: bash
        run: node desktop/ui-src/node_modules/@tauri-apps/cli/tauri.js --version

      # build.rs writes desktop/icons/icon.png at build time, but the bundler
      # also needs .ico/.icns/sized PNGs, so extract the embedded icon and
      # expand it with `tauri icon` before bundling.
      - name: Generate app icons
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re
          src = open("desktop/build.rs").read()
          b64 = re.search(r'ICON_PNG_BASE64: &str = "([^"]+)"', src).group(1)
          open("desktop/icons/icon.png", "wb").write(base64.b64decode(b64))
          PY
          node desktop/ui-src/node_modules/@tauri-apps/cli/tauri.js icon desktop/icons/icon.png --output desktop/icons

      # With a releaseId it uploads into the draft; without one (dry run) it
      # only builds. Both sign the update bundles (createUpdaterArtifacts in
      # tauri.conf.json), a release with the real key and a dry run with the
      # throwaway one; the build fails without a key. With a release it also uploads the .sig files and latest.json;
      # `publish` rewrites latest.json from all of them (see
      # scripts/release/updater_json.py).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.TAURI_SIGNING_PRIVATE_KEY || needs.prepare.outputs.dry_run_key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: desktop
          # Run from projectPath (desktop/).
          tauriScript: node ui-src/node_modules/@tauri-apps/cli/tauri.js
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: >-
            ${{ matrix.args }}
            --config '{"bundle":{"icon":["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.icns","icons/icon.ico"]}}'

      - name: Collect the bundles
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir dist
          # target/release/bundle, or target/<triple>/release/bundle. (No
          # globstar: macOS ships bash 3.2.)
          find target -path '*/release/bundle/*' -type f \( \
              -path '*/bundle/appimage/*.AppImage' -o -path '*/bundle/appimage/*.AppImage.sig' -o \
              -path '*/bundle/deb/*.deb' -o -path '*/bundle/deb/*.deb.sig' -o \
              -path '*/bundle/dmg/*.dmg' -o \
              -path '*/bundle/macos/*.app.tar.gz' -o -path '*/bundle/macos/*.app.tar.gz.sig' -o \
              -path '*/bundle/msi/*.msi' -o -path '*/bundle/msi/*.msi.sig' -o \
              -path '*/bundle/nsis/*.exe' -o -path '*/bundle/nsis/*.exe.sig' \) -exec cp {} dist/ \;
          # The .app.tar.gz has no version or arch in its name; use the name
          # tauri-action gives it in a release.
          for f in dist/*.app.tar.gz dist/*.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            base=$(basename "$f"); name=${base%%.app.tar.gz*}; ext=${base#"$name"}
            mv "$f" "dist/${name}_${VERSION}_universal${ext}"
          done
          ls -l dist
          case "$RUNNER_OS" in
            Linux)   want=("*.AppImage" "*.AppImage.sig" "*.deb") ;;
            macOS)   want=("*_universal.dmg" "*_universal.app.tar.gz" "*_universal.app.tar.gz.sig") ;;
            Windows) want=("*.msi" "*.msi.sig" "*-setup.exe" "*-setup.exe.sig") ;;
          esac
          for p in "${want[@]}"; do
            compgen -G "dist/$p" >/dev/null || { echo "::error::no bundle matching $p"; exit 1; }
          done

      - name: Smoke-check the Linux bundles
        if: runner.os == 'Linux'
        run: |
          dpkg -I dist/*.deb
          dpkg -c dist/*.deb | grep -E 'usr/bin/[^/]+$'
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          bin=$(find "$RUNNER_TEMP/squashfs-root/usr/bin" -maxdepth 1 -type f -perm -u+x | head -n1)
          [ -n "$bin" ] || { echo "::error::no executable in the AppImage's usr/bin"; exit 1; }
          file "$bin"
          file "$bin" | grep -q 'ELF 64-bit'

      - name: Smoke-check the macOS bundle
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d)
          # bundle.licenseFile gives the DMG a licence agreement (#210/#274):
          # check it is there, then accept it non-interactively to attach.
          hdiutil imageinfo "$dmg" | grep -q 'Software License Agreement: true' || { echo "::error::the DMG has no licence agreement"; exit 1; }
          { yes || true; } | PAGER=cat hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          # install.sh copies exactly nauvi.app (#430): a renamed bundle
          # must fail here, not on users' Macs.
          app="$mnt/nauvi.app"
          [ -d "$app" ] || { echo "::error::the DMG has no nauvi.app: $(ls "$mnt")"; hdiutil detach "$mnt"; exit 1; }
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo -archs "$bin"
          archs=$(lipo -archs "$bin")
          hdiutil detach "$mnt"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "::error::not a universal binary: $archs"; exit 1; }

      - name: Smoke-check the Windows bundles
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in dist/*.msi dist/*.exe; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            [ "$size" -gt 1000000 ] || { echo "::error::$f is suspiciously small"; exit 1; }
          done

      # Also in a real release: `scan` reads them from here.
      - name: Upload the bundles as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  cli:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache (GitHub keeps 10 GB per repo); PRs and tags reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: release-cli-${{ matrix.target }}

      - name: Build the CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p nauvi --target "$TARGET"

      # x86_64-apple-darwin runs under Rosetta on the arm64 macOS runner.
      - name: Smoke-check the CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/nauvi"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          file "$bin" || true
          "$bin" --help

      - name: Package
        id: package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="nauvi-cli-${TAG}-${TARGET}"
          out="target/${TARGET}/release"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$out/nauvi.exe" "$name/"
            7z a "$name.zip" "$name"
            asset="$name.zip"
          else
            cp "$out/nauvi" "$name/"
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload to the draft release
        if: needs.prepare.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" --clobber

      # Also in a real release: `scan` reads them from here.
      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  # CycloneDX SBOMs, attached to the release (#341): one per Rust package
  # (the CLI and the desktop app, with every target's dependencies) and one
  # of the frontend's production npm dependencies, which the app embeds.
  sbom:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/ui-src/.nvmrc

      # An exact version, built from its lock file; bump it on purpose.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version "=0.5.9" --locked

      - name: Write the SBOMs
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir sbom
          # Writes <package>.cdx.json next to each Cargo.toml. --target all:
          # the dependencies of every platform, not only this runner's.
          cargo cyclonedx --format json --spec-version 1.5 --target all
          mv nauvi.cdx.json "sbom/nauvi-$TAG-cli.cdx.json"
          mv desktop/nauvi-desktop.cdx.json "sbom/nauvi-$TAG-desktop.cdx.json"
          # From the lock file; only what ships (no Vite, Playwright, ...).
          (cd desktop/ui-src && npm sbom --sbom-format cyclonedx --omit dev --package-lock-only) \
            > "sbom/nauvi-$TAG-desktop-ui.cdx.json"
          python3 - sbom/*.cdx.json <<'PY'
          import json, sys
          for path in sys.argv[1:]:
              bom = json.load(open(path))
              n = len(bom.get("components", []))
              assert bom.get("bomFormat") == "CycloneDX", f"{path}: not a CycloneDX BOM"
              assert n > 0, f"{path}: no components"
              print(f"{path}: CycloneDX {bom.get('specVersion')}, {n} components")
          PY

      - name: Upload the SBOMs as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Grype on the SBOMs and on what the Linux bundles and the Linux CLI unpack
  # to (the macOS and Windows builds are covered by the Rust SBOMs, which list
  # every target's crates). Fails on a High or Critical finding with a fix and
  # reports the rest in the job summary; `publish` waits for it. Read-only,
  # no secrets.
  scan:
    needs: [prepare, desktop, cli, sbom]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      # An exact release, checked against its published SHA-256.
      GRYPE_VERSION: 0.121.1
      GRYPE_SHA256: bc3ea3f9e6fd56ac781c08c6c5e614271b79f438200757f6932085c19b0a4657
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    steps:
      # For scripts/release/grype_report.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/in/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux
          path: ${{ runner.temp }}/in/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/in/cli

      - name: Install Grype
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          mkdir grype-bin
          tar xzf grype.tar.gz -C grype-bin grype
          echo "$RUNNER_TEMP/grype-bin" >> "$GITHUB_PATH"

      - name: Unpack the Linux bundles and the CLI
        run: |
          in="$RUNNER_TEMP/in"
          un="$RUNNER_TEMP/unpacked"
          mkdir -p "$un/deb" "$un/cli"
          appimage=$(ls "$in"/desktop/*.AppImage)
          chmod +x "$appimage"
          (cd "$un" && "$appimage" --appimage-extract >/dev/null && mv squashfs-root appimage)
          dpkg-deb -x "$(ls "$in"/desktop/*.deb)" "$un/deb"
          tar xzf "$(ls "$in"/cli/*.tar.gz)" -C "$un/cli"
          du -sh "$un"/*

      - name: Scan
        run: |
          grype db update
          grype version
          out="$RUNNER_TEMP/scan"
          mkdir -p "$out"
          for f in "$RUNNER_TEMP"/in/sbom/*.cdx.json; do
            grype "sbom:$f" -o json --file "$out/sbom-$(basename "$f" .cdx.json).json"
          done
          for d in appimage deb cli; do
            grype "dir:$RUNNER_TEMP/unpacked/$d" -o json --file "$out/$d.json"
          done
          rc=0
          python3 scripts/release/grype_report.py "$out"/*.json > "$out/report.md" || rc=$?
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$out/report.md"
          exit "$rc"

      - name: Upload the scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-scan
          path: ${{ runner.temp }}/scan/
          if-no-files-found: warn
          retention-days: 30

  # The one-line installers (#430) pick their files out of SHA256SUMS by
  # name: run install.sh (app and CLI) and install.ps1 -Cli against the
  # built bundles and CLI archives, in a throwaway HOME, before anything is
  # published (and in dry runs). This runs the release's AppImage and CLI,
  # so it is a job of its own with a read-only token; `publish` waits for
  # it. The .dmg and .msi installs need macOS / Windows: check that the
  # name each script looks for matches one file.
  install-check:
    needs: [prepare, desktop, cli]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      # For install.sh and install.ps1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{desktop-*,cli-*}"
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Try the install scripts against these assets
        run: |
          assets="$RUNNER_TEMP/assets"
          (cd "$assets" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          base="file://$assets"
          home=$(mktemp -d)
          HOME="$home" NAUVI_DOWNLOAD_BASE="$base" sh install.sh
          HOME="$home" NAUVI_DOWNLOAD_BASE="$base" sh install.sh --cli
          "$home/.local/bin/nauvi" --version
          test -x "$home/.local/bin/nauvi-desktop"
          grep -qx 'MimeType=x-scheme-handler/nauvi;' "$home/.local/share/applications/nauvi.desktop"
          ls "$home"/.local/share/icons/hicolor/*/apps/nauvi.png
          HOME="$home" sh install.sh --uninstall
          test ! -e "$home/.local/bin/nauvi-desktop"
          rm -rf "$home"

          # pwsh is on the Ubuntu runners; the user PATH part is a no-op here.
          dir=$(mktemp -d)
          NAUVI_DOWNLOAD_BASE="$base" NAUVI_INSTALL_DIR="$dir" PROCESSOR_ARCHITECTURE=AMD64 \
            pwsh -NoProfile -NonInteractive -File install.ps1 -Cli
          test -s "$dir/nauvi.exe"
          rm -rf "$dir"

          for p in '_universal\.dmg$' '_x64_en-US\.msi$'; do
            n=$(awk '{ print $2 }' "$assets/SHA256SUMS" | grep -cE "$p" || true)
            [ "$n" -eq 1 ] || { echo "::error::$n files match $p; the install scripts expect one"; exit 1; }
          done

  # The apt repository (#427), before anything is published (and in dry
  # runs): scripts/release/apt-repo-check.sh builds it from this .deb with a
  # throwaway key, serves it on 127.0.0.1 and, in clean ubuntu:22.04 and
  # ubuntu:24.04 containers, follows the README's steps, installs nauvi,
  # upgrades it from an older version and runs it. It runs the release's
  # package, so it is a job of its own with a read-only token and no
  # secrets; `publish` waits for it.
  apt-check:
    needs: [prepare, desktop]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      # For scripts/release/apt-repo*.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux
          path: ${{ runner.temp }}/desktop

      - name: Install and upgrade nauvi from a test apt repository
        run: |
          command -v apt-ftparchive >/dev/null || { sudo apt-get update && sudo apt-get install -y apt-utils; }
          scripts/release/apt-repo-check.sh "$(ls "$RUNNER_TEMP"/desktop/*.deb)" ubuntu:22.04 ubuntu:24.04

  publish:
    needs: [prepare, desktop, cli, sbom, scan, install-check, apt-check]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      # For tauri.conf.json's updater key and scripts/release/updater_json.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the release assets
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS
          # tauri-action's latest.json: checked against, then replaced.
          if [ -f assets/latest.json ]; then mv assets/latest.json tauri-action-latest.json; fi

      - name: Fetch the SBOMs
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: assets

      # The bundles, the CLI archives and the SBOMs (not the scan reports).
      - name: Fetch the workflow artifacts (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{desktop-*,cli-*,sbom}"
          path: assets
          merge-multiple: true

      - name: Check every expected asset is there and write SHA256SUMS
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd assets
          ls -l
          fail=0
          for p in "*.AppImage" "*.deb" "*_universal.dmg" "*.msi" "*-setup.exe" \
                   "*.AppImage.sig" "*_universal.app.tar.gz" "*_universal.app.tar.gz.sig" \
                   "*.msi.sig" "*-setup.exe.sig" \
                   "nauvi-cli-$TAG-x86_64-unknown-linux-gnu.tar.gz" \
                   "nauvi-cli-$TAG-aarch64-apple-darwin.tar.gz" \
                   "nauvi-cli-$TAG-x86_64-apple-darwin.tar.gz" \
                   "nauvi-cli-$TAG-x86_64-pc-windows-msvc.zip" \
                   "nauvi-$TAG-cli.cdx.json" "nauvi-$TAG-desktop.cdx.json" \
                   "nauvi-$TAG-desktop-ui.cdx.json"; do
            compgen -G "$p" >/dev/null || { echo "::error::missing asset $p"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1

      # For the README's comparison (#341): what a user downloads.
      - name: Write the installer sizes to the job summary
        run: |
          cd assets
          # Platform, glob.
          row() {
            # shellcheck disable=SC2086 # $2 is a glob
            for f in $2; do
              [ -e "$f" ] || continue
              mb=$(awk -v b="$(stat -c %s "$f")" 'BEGIN { printf "%.1f", b / 1048576 }')
              printf '| %s | `%s` | %s MB |\n' "$1" "$f" "$mb"
            done
          }
          {
            echo "## Installer sizes"
            echo
            echo "| Platform | File | Size |"
            echo "| --- | --- | ---: |"
            row "Linux (AppImage)" "*.AppImage"
            row "Linux (deb)" "*.deb"
            row "macOS (dmg, universal)" "*_universal.dmg"
            row "macOS (update bundle)" "*_universal.app.tar.gz"
            row "Windows (NSIS installer)" "*-setup.exe"
            row "Windows (MSI)" "*.msi"
            row "CLI" "nauvi-cli-*"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Every .sig must verify against the public key the app ships with, or
      # the app would refuse the update. A dry run is signed with the
      # throwaway key instead (#442), so it is checked against that one.
      - name: Verify the update signatures
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          DRY_RUN_PUBKEY: ${{ needs.prepare.outputs.dry_run_pubkey }}
        run: |
          # Ubuntu 22.04 has no minisign package; the script checks the same.
          python3 -m pip install --quiet --require-hashes --only-binary :all: \
            -r scripts/release/requirements-verify.txt
          config=desktop/tauri.conf.json
          if [ "$DRY_RUN" = "true" ]; then
            config="$RUNNER_TEMP/dry-run-updater.json"
            python3 -c 'import json, os, sys; json.dump({"plugins": {"updater": {"pubkey": os.environ["DRY_RUN_PUBKEY"]}}}, open(sys.argv[1], "w"))' "$config"
          fi
          python3 scripts/release/verify_sigs.py --pubkey-config "$config" --assets assets

      - name: Write latest.json and SHA256SUMS
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          check=()
          if [ -f tauri-action-latest.json ]; then check=(--check tauri-action-latest.json); fi
          python3 scripts/release/updater_json.py --assets assets --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" "${check[@]}" --out assets/latest.json
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # The Homebrew cask and formula for this release (#168), from
      # packaging/homebrew/. A dry run renders them too, so a renamed asset
      # shows up before a tag; `homebrew` pushes them to the tap.
      - name: Render the Homebrew cask and formula
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: scripts/release/homebrew.sh assets/SHA256SUMS "$TAG" homebrew

      - name: Upload the Homebrew files as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew
          path: homebrew/
          if-no-files-found: error
          retention-days: 7

      - name: Upload latest.json and SHA256SUMS as workflow artifacts (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: |
            assets/SHA256SUMS
            assets/latest.json
          retention-days: 7

      # latest.json goes up last of all, together with publishing: the
      # app's endpoint (releases/latest/download/latest.json) only sees
      # published releases.
      - name: Upload latest.json and SHA256SUMS and publish the release
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" assets/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" assets/latest.json assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

  # Pushes the cask and formula `publish` rendered to nexburst/homebrew-tap
  # (#168): real, non-pre-release releases only, never a dry run. The token
  # is HOMEBREW_TAP_TOKEN in the `release` environment (a fine-grained PAT
  # with Contents read and write on that repository only); without it the job
  # only leaves a notice. No checkout: no code of this repository runs next
  # to the token.
  homebrew:
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run == 'false'
    environment: release
    permissions: {}
    runs-on: ubuntu-22.04
    steps:
      - name: Check the token and the release
        id: check
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice title=Homebrew tap not updated::HOMEBREW_TAP_TOKEN is not set in the release environment. Copy the files of the 'homebrew' workflow artifact into nexburst/homebrew-tap by hand."
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-* ]]; then
            echo "::notice title=Homebrew tap not updated::$TAG is a pre-release; the tap only follows releases."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the rendered files
        if: steps.check.outputs.push == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew
          path: ${{ runner.temp }}/homebrew

      - name: Push to nexburst/homebrew-tap
        if: steps.check.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # git asks gh for the credentials, so the token never lands in a
          # URL or in .git/config.
          gh auth setup-git
          tap="$RUNNER_TEMP/tap"
          git clone --depth 1 https://github.com/nexburst/homebrew-tap.git "$tap"
          mkdir -p "$tap/Casks" "$tap/Formula"
          cp "$RUNNER_TEMP/homebrew/Casks/nauvi.rb" "$tap/Casks/nauvi.rb"
          cp "$RUNNER_TEMP/homebrew/Formula/nauvi-cli.rb" "$tap/Formula/nauvi-cli.rb"
          cd "$tap"
          git add Casks/nauvi.rb Formula/nauvi-cli.rb
          if git diff --cached --quiet; then
            echo "::notice title=Homebrew tap::already at $TAG"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "nauvi ${TAG#v}" -m "From https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          git push origin HEAD:main
          echo "Pushed nauvi ${TAG#v} to nexburst/homebrew-tap" >> "$GITHUB_STEP_SUMMARY"

  # The apt repository on GitHub Pages (#427), real non-pre-release releases
  # only (dpkg would sort 0.2.0-1 after 0.2.0). Two jobs, so the signing key
  # and a write token never share one: `apt` (the `release` environment, a
  # read-only token) adds this run's .deb to the repository that the
  # gh-pages branch serves under apt/ (after checking what is there against
  # the keys in scripts/release/apt-keys.txt), signs it with APT_GPG_PRIVATE_KEY
  # (and APT_GPG_PASSPHRASE, if the key has one) and uploads it as an
  # artifact; `apt-pages` (no secret) pushes that to gh-pages. Without the
  # key, `apt` only leaves a notice.
  apt:
    needs: [prepare, desktop, publish]
    if: needs.prepare.outputs.dry_run == 'false'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    outputs:
      push: ${{ steps.check.outputs.push }}
      apt_tree: ${{ steps.site.outputs.apt_tree }}
    steps:
      - name: Check the key and the release
        id: check
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::notice title=apt repository not updated::APT_GPG_PRIVATE_KEY is not set in the release environment."
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-* ]]; then
            echo "::notice title=apt repository not updated::$TAG is a pre-release; the apt repository only follows releases."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      # For scripts/release/apt-repo.sh, at the released commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.push == 'true'
        with:
          persist-credentials: false

      # The .deb this run built, not the release asset: anything with a
      # write token can add assets to the release (and change SHA256SUMS
      # next to them) while this job waits for approval. Artifact names are
      # unique within a run, so only `desktop` can have made this one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.push == 'true'
        with:
          name: desktop-linux
          path: ${{ runner.temp }}/desktop

      - name: Pick the .deb of this release
        if: steps.check.outputs.push == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          debs=("$RUNNER_TEMP"/desktop/*.deb)
          [ ${#debs[@]} -eq 1 ] || { echo "::error::expected exactly one .deb in desktop-linux, found ${#debs[@]}"; exit 1; }
          version=$(dpkg-deb -f "${debs[0]}" Version)
          [ "$version" = "${TAG#v}" ] || { echo "::error::the .deb has version $version, not ${TAG#v}"; exit 1; }
          mkdir "$RUNNER_TEMP/deb"
          cp "${debs[0]}" "$RUNNER_TEMP/deb/"
          echo "apt: nauvi $version, sha256 \`$(sha256sum < "${debs[0]}" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      # Anonymous: the repository is public and this job has no write token.
      - name: Fetch the current repository from gh-pages
        id: site
        if: steps.check.outputs.push == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          url="https://github.com/$GITHUB_REPOSITORY.git"
          # apt_tree: the git tree of apt/ that was read (empty: none yet).
          # apt-pages pushes only if apt/ is still exactly that; the rest of
          # gh-pages (the website, pages.yml) may change meanwhile.
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" "$site"
            echo "apt_tree=$(git -C "$site" rev-parse -q --verify HEAD:apt || true)" >> "$GITHUB_OUTPUT"
          else
            echo "No gh-pages branch yet: starting an empty repository"
            mkdir "$site"
            echo "apt_tree=" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the .deb and sign the repository
        if: steps.check.outputs.push == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          command -v apt-ftparchive >/dev/null || { sudo apt-get update && sudo apt-get install -y apt-utils; }
          # The newest published release before this one: gh-pages must
          # already have it, or an older copy was put back there (#445).
          # A failed list must fail the job, not turn the check off.
          set -o pipefail
          current="${TAG#v}"
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName')
          APT_PREVIOUS=$(printf '%s\n' "$tags" \
            | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            | { grep -vxF "$current" || true; } \
            | { cat; echo "$current"; } | sort -V | sed -n "/^${current//./\\.}\$/q;p" | tail -n1)
          export APT_PREVIOUS
          echo "previous release: ${APT_PREVIOUS:-none}"
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import <<<"$APT_GPG_PRIVATE_KEY"
          APT_GPG_KEY=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          export APT_GPG_KEY
          scripts/release/apt-repo.sh "$RUNNER_TEMP/site/apt" "$RUNNER_TEMP"/deb/*.deb
          echo "apt repository signed with \`$APT_GPG_KEY\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signed repository
        if: steps.check.outputs.push == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-repository
          path: ${{ runner.temp }}/site/apt/
          if-no-files-found: error
          retention-days: 7

  # Replaces apt/ on the gh-pages branch with what `apt` signed, keeping
  # everything else there byte for byte (the website of pages.yml), as one
  # new commit with no history (old .deb files would otherwise stay in the
  # branch forever). Fails if apt/ changed since `apt` read it; if only the
  # rest of the branch moved (a site deploy), it clones again and retries.
  # No checkout: no code of this repository runs next to the token.
  apt-pages:
    needs: [prepare, apt]
    if: needs.prepare.outputs.dry_run == 'false' && needs.apt.outputs.push == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apt-repository
          path: ${{ runner.temp }}/apt

      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          APT_TREE: ${{ needs.apt.outputs.apt_tree }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # git asks gh for the credentials, so the token never lands in a
          # URL or in .git/config.
          gh auth setup-git
          url="https://github.com/$GITHUB_REPOSITORY.git"

          publish() {
            local pages="$1" base=""
            if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
              git clone --quiet --depth 1 --branch gh-pages "$url" "$pages"
              base=$(git -C "$pages" rev-parse HEAD)
            else
              git init --quiet "$pages"
              git -C "$pages" remote add origin "$url"
            fi
            cd "$pages"
            now=$(git rev-parse -q --verify HEAD:apt 2>/dev/null || true)
            if [ "$now" != "$APT_TREE" ]; then
              echo "::error::apt/ on gh-pages changed from tree ${APT_TREE:-none} to ${now:-none} while the repository was signed; re-run the apt job (apt-pages runs again after it)"
              exit 1
            fi
            rm -rf apt
            cp -r "$RUNNER_TEMP/apt" apt
            # Pages would otherwise run Jekyll over the branch.
            touch .nojekyll
            git add -A
            if [ -n "$base" ]; then
              bad=$(git diff --cached --name-only "$base" | { grep -vE '^(apt/|\.nojekyll$)' || true; })
              if [ -n "$bad" ]; then
                echo "::error::refusing to publish: it would change paths outside apt/:"
                printf '%s\n' "$bad" | head -n 20
                exit 1
              fi
            fi
            git checkout --quiet --orphan apt-update
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --quiet -m "apt repository: nauvi ${TAG#v}" -m "From https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            # With no gh-pages yet, base is empty: the lease then expects none.
            # A refused lease (gh-pages moved since the clone) returns 75:
            # clone again and retry. Any other failure ends the job.
            git push --force-with-lease="gh-pages:$base" origin apt-update:gh-pages || return 75
          }

          for attempt in 1 2 3 4 5; do
            # Not `(…) || rc=$?`: bash ignores set -e inside a subshell
            # whose status is tested, and a failed step would go unnoticed.
            set +e
            (set -euo pipefail; publish "$RUNNER_TEMP/pages-$attempt")
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "apt repository updated to nauvi ${TAG#v}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$rc" -eq 75 ] || exit "$rc"
            echo "gh-pages moved while publishing (attempt $attempt); trying again"
            sleep $((attempt * 10))
          done
          echo "::error::could not push to gh-pages after 5 attempts"
          exit 1

  # The tag's docs on the website (pages.yml, #468): docs/<tag>/ is added
  # and docs/latest/ moves to the newest release; the landing page, apt/ and
  # older versions are left as they are. Only after the release is public,
  # so the docs never describe a release that failed.
  docs-pages:
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run == 'false'
    permissions:
      contents: write
    # The self-repository form: pages.yml of this same commit.
    uses: $/.github/workflows/pages.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
