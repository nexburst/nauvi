# cargo-deny (https://embarkstudios.github.io/cargo-deny/): security
# advisories, licences, banned or duplicate crates and crate sources.
# CI runs `cargo deny check` in .github/workflows/security.yml.

[graph]
# The platforms nauvi ships on; crates only other targets use are not
# checked.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# Each ignore says why it can't be fixed here and when to look again
# (cargo-deny has no expiry field: the date is in the reason).
ignore = [
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml (unmaintained, no known vulnerability) comes in through serde_yaml, which kube-client depends on as well, so replacing our own serde_yaml would not remove it. Review by 2027-05-01 or when kube drops serde_yaml." },
]

[licenses]
# Permissive licences compatible with shipping nauvi under MIT.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# Several versions of one crate are normal in a Tauri dependency tree; they
# only make the build bigger.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
