[workspace]
members = [".", "desktop"]
resolver = "2"

[package]
name = "kubeloupe"
version = "0.1.0"
edition = "2021"
description = "A Lens alternative written in Rust — a Kubernetes IDE"
license = "MIT"
repository = "https://github.com/pedrosanzmtz/kubeloupe"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
flate2 = "1"
futures = "0.3"
home = "0.5"
http = "1"
k8s-openapi = { version = "0.29", features = ["latest"] }
kube = { version = "2", features = ["runtime", "http-proxy", "ws", "oidc", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
tokio = { version = "1", features = ["full"] }
# The layer that adds cached exec plugin tokens to requests (#201).
tower = { version = "0.5", features = ["buffer", "filter"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# `specta::Type` derives on the IPC structs, used by the desktop app to
# generate TypeScript bindings. The CLI does not enable it.
specta = ["dep:specta"]

[target.'cfg(unix)'.dependencies]
# Restore the default SIGPIPE action in the CLI (`kubeloupe get pods | head`).
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# Debug builds: keep line tables for our own crates (readable backtraces) and
# drop debug info for dependencies. Full debug info made every target/ dir
# 7–25 GB and made linking the desktop app use several GB of RAM.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
