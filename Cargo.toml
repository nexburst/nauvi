[workspace]
members = [".", "desktop"]
resolver = "2"

# The oldest Rust that builds the workspace (#388): kube 5.1 and
# parking_lot 0.13 need 1.95. CI checks that this version still builds.
[workspace.package]
rust-version = "1.95"

[package]
name = "nauvi"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "A Lens alternative written in Rust — a Kubernetes IDE"
license = "MIT"
repository = "https://github.com/nexburst/nauvi"

[dependencies]
anyhow = "1"
base64 = "0.23"
# SPDY frames of multiplexed port-forwards (#399); the version tokio uses.
bytes = "1"
jiff = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
flate2 = "1"
futures = "0.3"
home = "0.5"
http = "1"
# The port-forward client's own stack, as kube builds it but with
# TCP_NODELAY on (#374): the versions kube uses.
http-body-util = "0.1.2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-timeout = "0.5.2"
# The TLS connection to an https:// proxy (#362), with its own trust store:
# the versions kube uses, no crypto provider of their own (kube's is used).
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "logging", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "http1", "tokio"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
# The official Model Context Protocol SDK, for `nauvi mcp` (#298).
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"], optional = true }
kube = { version = "5", features = ["runtime", "http-proxy", "socks5", "ws", "oidc", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-platform-verifier = "0.7"
# The SHA-256 of a downloaded kubectl (#331).
sha2 = "0.10"
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
tokio = { version = "1", features = ["full"] }
# The port-forward WebSocket, with pings (#304); the version kube uses.
tokio-tungstenite = "0.30"
# The layer that adds cached exec plugin tokens to requests (#201).
tower = { version = "0.5", features = ["buffer", "filter", "retry", "util"] }
tower-http = { version = "0.7", features = ["decompression-gzip", "map-response-body", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# `nauvi mcp`, the MCP server (#298). The CLI needs it; the desktop app
# turns default features off so it does not build the MCP SDK.
default = ["mcp"]
mcp = ["dep:rmcp"]
# `specta::Type` derives on the IPC structs, used by the desktop app to
# generate TypeScript bindings. The CLI does not enable it.
specta = ["dep:specta"]
# Helpers for the desktop app's unit tests (`PortForward::idle`).
test-util = []

[[bin]]
name = "nauvi"
path = "src/main.rs"
required-features = ["mcp"]

[target.'cfg(unix)'.dependencies]
# Restore the default SIGPIPE action in the CLI (`nauvi get pods | head`).
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# The HTTPS proxy of `tests/proxy_cluster.rs` (#362): its CA and
# certificate, and its TLS server.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }

# Debug builds: keep line tables for our own crates (readable backtraces) and
# drop debug info for dependencies. Full debug info made every target/ dir
# 7–25 GB and made linking the desktop app use several GB of RAM.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

# Release builds (#353): one codegen unit and fat LTO make the app's code
# about a fifth smaller (40 -> 31 MB of text), which is resident memory of
# every running app and the size of the installers. They take longer to
# build (about 12 -> 18 min for the desktop app on a 4-core machine).
[profile.release]
lto = "fat"
codegen-units = 1
