[package]
name = "nauvi-desktop"
version = "0.4.2"
edition = "2021"
rust-version.workspace = true
description = "nauvi desktop app — a Lens alternative in Rust, built with Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.23"

[dependencies]
anyhow = "1"
futures = "0.3"
kube = { version = "5", features = ["ws"] }
nauvi = { path = "..", default-features = false, features = ["specta"] }
portable-pty = "0.9"
# Secret-looking text is masked in the app log (#208).
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# The save dialog of the CSV export (#221), shown from `commands/files.rs`.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The Ask AI session tokens of `nauvi show` (#548); already in the tree.
getrandom = "0.3"
tauri-plugin-updater = "=2.14.1"
tokio = { version = "1", features = ["full"] }
# The app log (#208).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
auto-launch = "0.6"
# The kubectl download (#331): the reqwest and rustls the updater already
# builds (rustls with ring), plus SOCKS5 for the cluster's proxy setting.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
# `PortForward::idle`, for the tests of the session maps.
nauvi = { path = "..", default-features = false, features = ["specta", "test-util"] }
# Paused time, for the terminal output batches.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Quit confirmation (#173): answers `applicationShouldTerminate:`. The same
# version tao uses.
objc2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# One running app (#202); on Linux through the D-Bus session bus. macOS
# uses its own socket in a private directory (#555, `single_instance/`).
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
# getuid and the peer of the single-instance socket (#555). Already in the
# tree.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# The OS version in About and the diagnostics (#294), read from the registry.
# Already in the tree through hyper-util.
windows-registry = "0.100"
