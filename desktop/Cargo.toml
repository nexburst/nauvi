[package]
name = "kubeloupe-desktop"
version = "0.1.0"
edition = "2021"
description = "kubeloupe desktop app — a Lens alternative in Rust, built with Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.23"

[dependencies]
anyhow = "1"
futures = "0.3"
kube = { version = "2", features = ["ws"] }
kubeloupe = { path = "..", features = ["specta"] }
portable-pty = "0.9"
# Secret-looking text is masked in the app log (#208).
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# The save dialog of the CSV export (#221), shown from `commands/files.rs`.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# One running app (#202); on Linux through the D-Bus session bus.
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.14.1"
tokio = { version = "1", features = ["full"] }
# The app log (#208).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Quit confirmation (#173): answers `applicationShouldTerminate:`. The same
# version tao uses.
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# The OS version in About and the diagnostics (#294), read from the registry.
# Already in the tree through hyper-util.
windows-registry = "0.6"
