# Stand-ins for Kubescape's VulnerabilityManifestSummary and
# VulnerabilityManifest (spdx.softwarecomposition.kubescape.io/v1beta1).
#
# Kubescape does not ship these as CRDs: its storage component serves them
# from an aggregated API server (kubescape/storage). For nauvi only the
# group, version, plural and namespaced scope matter (discovery, list, get),
# so the tests and the QA scenario install these schemaless CRDs instead and
# create fixture objects shaped like kubescape/storage's v1beta1 types
# (pkg/apis/softwarecomposition/v1beta1/types.go) with kubevuln's labels and
# annotations (#538). Not applied by setup.sh: the tests apply them, the QA
# scenario applies them to the second cluster only and removes them.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vulnerabilitymanifestsummaries.spdx.softwarecomposition.kubescape.io
spec:
  group: spdx.softwarecomposition.kubescape.io
  names:
    kind: VulnerabilityManifestSummary
    listKind: VulnerabilityManifestSummaryList
    plural: vulnerabilitymanifestsummaries
    singular: vulnerabilitymanifestsummary
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vulnerabilitymanifests.spdx.softwarecomposition.kubescape.io
spec:
  group: spdx.softwarecomposition.kubescape.io
  names:
    kind: VulnerabilityManifest
    listKind: VulnerabilityManifestList
    plural: vulnerabilitymanifests
    singular: vulnerabilitymanifest
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
